name: Corporate-safe Windows x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/corporate-safe

concurrency:
  group: corporate-safe-release-x64
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout hardened branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify corporate-safe source contract
        shell: pwsh
        run: python tools/verify_corporate_hardening.py

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore Win32CaptureSample.sln -PackagesDirectory packages -NonInteractive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: msbuild Win32CaptureSample.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = 'x64\Release\SpatialCanvas.exe'
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }
          Get-Item $exe | Format-List Name,Length,FullName
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload hardened executable
        uses: actions/upload-artifact@v4
        with:
          name: SpatialCanvas-corporate-safe-x64
          path: x64/Release/SpatialCanvas.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish executable-only distribution branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'x64\Release\SpatialCanvas.exe'
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/heads/release/exe-only:refs/remotes/origin/release/exe-only
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch release/exe-only' }

          $blob = git hash-object -w $exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not create executable blob' }
          $distributionIndex = Join-Path $env:RUNNER_TEMP 'spatial-canvas-distribution.index'
          $env:GIT_INDEX_FILE = $distributionIndex
          git read-tree --empty
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize executable-only index' }
          git update-index --add --cacheinfo "100644,$blob,SpatialCanvas.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Could not add executable to distribution index' }
          $tree = git write-tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not create executable-only tree' }
          $parent = git rev-parse refs/remotes/origin/release/exe-only
          $message = "Automated Release x64 from $env:GITHUB_SHA"
          $commit = $message | git commit-tree $tree -p $parent
          if ($LASTEXITCODE -ne 0) { throw 'Could not create distribution commit' }

          $files = @(git ls-tree -r --name-only $commit)
          if ($files.Count -ne 1 -or $files[0] -ne 'SpatialCanvas.exe') {
            throw "Distribution tree must contain only SpatialCanvas.exe: $files"
          }
          git push origin "${commit}:refs/heads/release/exe-only"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release/exe-only' }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Published release/exe-only commit=$commit sha256=$hash"
